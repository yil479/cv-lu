<!DOCTYPE html>
<!--
  OG image template for cv-santiago.vercel.app (1200x630).
  Rendered to public/og-image.webp by scripts/generate-og-image.ts (Playwright + cwebp).
  Replicates the home hero design tokens 1:1 (no AI-invented styling).
  Placeholders resolved at render time: __FONT_SG__ __FONT_DM__
  Text-only card (no avatar/photo yet, no star-count badge — this isn't an OSS project).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 400 700;
    font-display: block;
    src: url('__FONT_SG__') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-weight: 400 600;
    font-display: block;
    src: url('__FONT_DM__') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    /* exact hero tokens: --background 240 6% 10%, dot grid radial(circle, hsl(0 0% 18%) 1px) 24px */
    background-color: hsl(240 6% 10%);
    background-image: radial-gradient(circle, hsl(0 0% 18%) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: hsl(0 0% 93%);
    display: flex;
    align-items: center;
    padding: 0 100px;
    overflow: hidden;
    position: relative;
  }
  /* soft purple glow top-right, like the hero ambient */
  body::after {
    content: '';
    position: absolute;
    top: -180px; right: -180px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, hsl(270 91% 78% / 0.10), transparent 70%);
    pointer-events: none;
  }
  .content { display: flex; flex-direction: column; }
  .greeting {
    font-size: 32px;
    color: hsl(0 0% 62%);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .greeting .handle {
    background-image: linear-gradient(to right, hsl(187 86% 53%), hsl(270 91% 78%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 76px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.02em;
    background-image: linear-gradient(to right, hsl(187 86% 53%), hsl(270 91% 78%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 22px;
  }
  .sub {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 34px;
    line-height: 1.32;
    font-weight: 500;
    color: hsl(0 0% 82%);
    letter-spacing: -0.005em;
    margin-bottom: 36px;
  }
  .pills { display: flex; gap: 12px; align-items: center; }
  .pill {
    font-size: 24px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 9999px;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .pill.solid {
    border: 1px solid hsl(187 86% 53%);
    background: hsl(187 86% 53% / 0.15);
    color: hsl(0 0% 96%);
  }
  .pill.ghost {
    border: 1px solid hsl(187 86% 53% / 0.30);
    background: hsl(240 6% 10% / 0.6);
    color: hsl(0 0% 72%);
  }
  .domain {
    position: absolute;
    bottom: 54px; right: 90px;
    font-size: 26px;
    font-weight: 600;
    color: hsl(0 0% 55%);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="greeting">Hi, I'm <span class="handle">Louis Lu</span></div>
    <h1>Senior Software Engineer</h1>
    <div class="sub">Applied AI/ML · Production RAG Systems</div>
    <div class="pills">
      <span class="pill solid">Senior SWE</span>
      <span class="pill ghost">Applied AI/ML</span>
    </div>
  </div>
  <div class="domain">cv-santiago.vercel.app</div>
</body>
</html>
